<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="100%" height="auto" role="img" aria-label="定时调度线框图">
  <rect width="720" height="520" fill="#f8fafc"/>
  <g font-family="-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif">
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">调度</text>
    <rect x="600" y="16" width="96" height="32" rx="8" fill="#2563eb"/>
    <text x="648" y="36" font-size="12" fill="#ffffff" text-anchor="middle">新建调度</text>

    <!-- 调度列表 -->
    <rect x="24" y="60" width="672" height="104" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M24 70a10 10 0 0 1 10-10h652a10 10 0 0 1 10 10v22H24z" fill="#f8fafc"/>
    <line x1="24" y1="92" x2="696" y2="92" stroke="#e2e8f0"/>
    <text x="40" y="81" font-size="10.5" fill="#64748b">频率</text>
    <text x="160" y="81" font-size="10.5" fill="#64748b">时间</text>
    <text x="260" y="81" font-size="10.5" fill="#64748b">时区</text>
    <text x="420" y="81" font-size="10.5" fill="#64748b">状态</text>
    <text x="510" y="81" font-size="10.5" fill="#64748b">下次运行</text>
    <text x="618" y="81" font-size="10.5" fill="#64748b">操作</text>

    <text x="40" y="118" font-size="11.5" fill="#0f172a">每天</text>
    <text x="160" y="118" font-size="11.5" fill="#475569">08:00</text>
    <text x="260" y="118" font-size="11" fill="#64748b">Asia/Shanghai</text>
    <rect x="420" y="106" width="44" height="20" rx="10" fill="#ecfdf5"/>
    <text x="442" y="120" font-size="9.5" fill="#15803d" text-anchor="middle">启用</text>
    <text x="510" y="118" font-size="11" fill="#475569">10-26 08:00</text>
    <text x="618" y="118" font-size="10" fill="#2563eb">编辑</text>
    <text x="656" y="118" font-size="10" fill="#dc2626">删除</text>
    <line x1="40" y1="132" x2="680" y2="132" stroke="#f1f5f9"/>
    <text x="40" y="152" font-size="11" fill="#94a3b8">行内可启用 / 停用；调度触发后运行历史的触发方式显示「调度」。</text>

    <!-- 新建调度弹窗 -->
    <rect x="24" y="188" width="392" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="216" font-size="13" font-weight="600" fill="#0f172a">新建调度</text>
    <text x="396" y="216" font-size="13" fill="#94a3b8">×</text>
    <line x1="24" y1="230" x2="416" y2="230" stroke="#f1f5f9"/>

    <text x="40" y="258" font-size="11" fill="#475569">频率</text>
    <text x="96" y="258" font-size="11" fill="#2563eb">●</text>
    <text x="108" y="258" font-size="10.5" fill="#334155">每天</text>
    <text x="150" y="258" font-size="11" fill="#94a3b8">○</text>
    <text x="162" y="258" font-size="10.5" fill="#64748b">每周</text>
    <text x="204" y="258" font-size="11" fill="#94a3b8">○</text>
    <text x="216" y="258" font-size="10.5" fill="#64748b">每月</text>
    <text x="258" y="258" font-size="11" fill="#94a3b8">○</text>
    <text x="270" y="258" font-size="10.5" fill="#64748b">Cron</text>

    <text x="40" y="292" font-size="11" fill="#475569">时间</text>
    <rect x="96" y="278" width="52" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="122" y="295" font-size="10.5" fill="#0f172a" text-anchor="middle">08</text>
    <text x="158" y="295" font-size="11" fill="#94a3b8">:</text>
    <rect x="170" y="278" width="52" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="196" y="295" font-size="10.5" fill="#0f172a" text-anchor="middle">00</text>

    <text x="40" y="326" font-size="11" fill="#475569">每周</text>
    <rect x="96" y="312" width="26" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="109" y="329" font-size="10" fill="#94a3b8" text-anchor="middle">一</text>
    <rect x="128" y="312" width="26" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="141" y="329" font-size="10" fill="#94a3b8" text-anchor="middle">二</text>
    <rect x="160" y="312" width="26" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="173" y="329" font-size="10" fill="#94a3b8" text-anchor="middle">三</text>
    <rect x="192" y="312" width="26" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="205" y="329" font-size="10" fill="#94a3b8" text-anchor="middle">四</text>
    <rect x="224" y="312" width="26" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="237" y="329" font-size="10" fill="#94a3b8" text-anchor="middle">五</text>
    <rect x="256" y="312" width="26" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="269" y="329" font-size="10" fill="#94a3b8" text-anchor="middle">六</text>
    <rect x="288" y="312" width="26" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="301" y="329" font-size="10" fill="#94a3b8" text-anchor="middle">日</text>
    <text x="326" y="329" font-size="9" fill="#94a3b8">选择每周生效日</text>

    <text x="40" y="360" font-size="11" fill="#475569">每月</text>
    <rect x="96" y="346" width="52" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="122" y="363" font-size="10.5" fill="#cbd5e1" text-anchor="middle">1</text>
    <text x="158" y="363" font-size="10.5" fill="#64748b">号</text>

    <text x="40" y="394" font-size="11" fill="#475569">Cron</text>
    <rect x="96" y="380" width="300" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="106" y="397" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#cbd5e1">*/5 * * * *</text>

    <text x="40" y="428" font-size="11" fill="#475569">时区</text>
    <rect x="96" y="414" width="180" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="106" y="431" font-size="10.5" fill="#0f172a">Asia/Shanghai</text>
    <text x="258" y="431" font-size="9" fill="#94a3b8">▾</text>

    <rect x="264" y="452" width="56" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="292" y="470" font-size="10.5" fill="#475569" text-anchor="middle">取消</text>
    <rect x="328" y="452" width="68" height="28" rx="7" fill="#2563eb"/>
    <text x="362" y="470" font-size="10.5" fill="#ffffff" text-anchor="middle">保存</text>

    <!-- 说明 -->
    <rect x="432" y="188" width="264" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="448" y="212" font-size="11.5" font-weight="600" fill="#0f172a">保存后</text>
    <text x="448" y="234" font-size="10.5" fill="#64748b">· 列表显示「下次运行时间」</text>
    <text x="448" y="254" font-size="10.5" fill="#64748b">· 行内可启用 / 停用 / 编辑 / 删除</text>
    <text x="448" y="274" font-size="10.5" fill="#64748b">· 到点由调度器触发运行</text>
    <text x="448" y="294" font-size="10.5" fill="#64748b">· 失败不影响下一次调度</text>
    <text x="448" y="316" font-size="9.5" fill="#94a3b8">时区默认 Asia/Shanghai，可按调度修改。</text>

    <rect x="432" y="352" width="264" height="136" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="448" y="376" font-size="11.5" font-weight="600" fill="#0f172a">频率规则</text>
    <text x="448" y="398" font-size="10.5" fill="#64748b">每天：按固定时分执行</text>
    <text x="448" y="418" font-size="10.5" fill="#64748b">每周：选星期 + 时分</text>
    <text x="448" y="438" font-size="10.5" fill="#64748b">每月：选日期 + 时分</text>
    <text x="448" y="458" font-size="10.5" fill="#64748b">Cron：五段表达式，精确到分钟</text>
    <text x="448" y="478" font-size="9.5" fill="#94a3b8">非法表达式保存时直接报错。</text>
  </g>
</svg>
