<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="100%" height="auto" role="img" aria-label="用户与角色页线框图">
  <rect width="720" height="470" fill="#f8fafc"/>
  <g font-family="-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif">
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">用户</text>
    <text x="60" y="36" font-size="11" fill="#94a3b8">共 3 个账号</text>
    <rect x="600" y="16" width="96" height="32" rx="8" fill="#2563eb"/>
    <text x="648" y="36" font-size="12" fill="#ffffff" text-anchor="middle">创建用户</text>

    <!-- 用户表格 -->
    <rect x="24" y="60" width="672" height="152" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M24 70a10 10 0 0 1 10-10h652a10 10 0 0 1 10 10v22H24z" fill="#f8fafc"/>
    <line x1="24" y1="92" x2="696" y2="92" stroke="#e2e8f0"/>
    <text x="40" y="81" font-size="10.5" fill="#64748b">用户名</text>
    <text x="180" y="81" font-size="10.5" fill="#64748b">角色</text>
    <text x="330" y="81" font-size="10.5" fill="#64748b">状态</text>
    <text x="440" y="81" font-size="10.5" fill="#64748b">创建时间</text>
    <text x="608" y="81" font-size="10.5" fill="#64748b">操作</text>

    <text x="40" y="116" font-size="12" fill="#0f172a">admin</text>
    <text x="180" y="116" font-size="12" fill="#475569">管理员</text>
    <circle cx="335" cy="112" r="3" fill="#16a34a"/>
    <text x="345" y="116" font-size="11.5" fill="#16a34a">启用</text>
    <text x="440" y="116" font-size="11.5" fill="#64748b">09-01 10:20</text>
    <text x="608" y="116" font-size="11" fill="#2563eb">更多 ▾</text>
    <line x1="40" y1="132" x2="680" y2="132" stroke="#f1f5f9"/>

    <text x="40" y="156" font-size="12" fill="#0f172a">alice</text>
    <text x="180" y="156" font-size="12" fill="#475569">工作流作者</text>
    <circle cx="335" cy="152" r="3" fill="#16a34a"/>
    <text x="345" y="156" font-size="11.5" fill="#16a34a">启用</text>
    <text x="440" y="156" font-size="11.5" fill="#64748b">09-12 14:02</text>
    <text x="608" y="156" font-size="11" fill="#2563eb">更多 ▾</text>
    <line x1="40" y1="172" x2="680" y2="172" stroke="#f1f5f9"/>

    <text x="40" y="196" font-size="12" fill="#0f172a">bob</text>
    <text x="180" y="196" font-size="12" fill="#475569">仪表板视图者</text>
    <circle cx="335" cy="192" r="3" fill="#94a3b8"/>
    <text x="345" y="196" font-size="11.5" fill="#94a3b8">禁用</text>
    <text x="440" y="196" font-size="11.5" fill="#64748b">09-20 09:31</text>
    <text x="608" y="196" font-size="11" fill="#2563eb">更多 ▾</text>

    <!-- 创建用户弹窗 -->
    <rect x="24" y="236" width="340" height="212" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="264" font-size="13" font-weight="600" fill="#0f172a">创建用户</text>
    <text x="344" y="264" font-size="13" fill="#94a3b8">×</text>
    <line x1="24" y1="278" x2="364" y2="278" stroke="#f1f5f9"/>

    <text x="40" y="302" font-size="11" fill="#475569">用户名</text>
    <rect x="96" y="288" width="240" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="106" y="305" font-size="10.5" fill="#cbd5e1">3–32 位字母数字与 _ . -</text>

    <text x="40" y="338" font-size="11" fill="#475569">密　码</text>
    <rect x="96" y="324" width="240" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="106" y="341" font-size="10.5" fill="#cbd5e1">至少 8 位</text>

    <text x="40" y="374" font-size="11" fill="#475569">角色</text>
    <rect x="42" y="384" width="10" height="10" rx="2" fill="#2563eb"/>
    <path d="M44 389l2.2 2.4L50 386" stroke="#ffffff" stroke-width="1.4" fill="none"/>
    <text x="58" y="393" font-size="10.5" fill="#334155">管理员</text>
    <rect x="42" y="406" width="10" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="58" y="415" font-size="10.5" fill="#334155">工作流作者</text>
    <rect x="186" y="384" width="10" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="202" y="393" font-size="10.5" fill="#334155">仪表板作者</text>
    <rect x="186" y="406" width="10" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="202" y="415" font-size="10.5" fill="#334155">仪表板视图者</text>

    <rect x="220" y="428" width="56" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="248" y="445" font-size="11" fill="#475569" text-anchor="middle">取消</text>
    <rect x="284" y="428" width="52" height="26" rx="6" fill="#2563eb"/>
    <text x="310" y="445" font-size="11" fill="#ffffff" text-anchor="middle">创建</text>

    <!-- 更多菜单 -->
    <text x="400" y="228" font-size="10.5" fill="#94a3b8">行内「更多」菜单</text>
    <rect x="400" y="236" width="190" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="416" y="262" font-size="11" fill="#334155">编辑角色 / 状态</text>
    <line x1="404" y1="274" x2="586" y2="274" stroke="#f1f5f9"/>
    <text x="416" y="292" font-size="11" fill="#334155">重置密码</text>
    <line x1="404" y1="304" x2="586" y2="304" stroke="#f1f5f9"/>
    <text x="416" y="322" font-size="11" fill="#334155">登录日志</text>
    <line x1="404" y1="334" x2="586" y2="334" stroke="#f1f5f9"/>
    <text x="416" y="352" font-size="11" fill="#dc2626">删除…</text>

    <text x="400" y="396" font-size="10" fill="#94a3b8">禁用 / 重置密码后</text>
    <text x="400" y="412" font-size="10" fill="#94a3b8">该用户会话立即失效</text>
    <text x="400" y="434" font-size="10" fill="#94a3b8">管理员不能禁用或删除自己</text>
  </g>
</svg>
