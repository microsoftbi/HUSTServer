<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="100%" height="auto" role="img" aria-label="数据探索页线框图">
  <rect width="720" height="470" fill="#f8fafc"/>
  <g font-family="-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif">
    <text x="24" y="36" font-size="16" font-weight="600" fill="#0f172a">数据探索</text>
    <text x="92" y="36" font-size="10.5" fill="#94a3b8">只读查询 · 结果可直接导出</text>

    <rect x="24" y="58" width="672" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <line x1="200" y1="58" x2="200" y2="388" stroke="#e2e8f0"/>
    <line x1="504" y1="58" x2="504" y2="388" stroke="#e2e8f0"/>

    <!-- 数据源 -->
    <text x="40" y="84" font-size="10" font-weight="600" fill="#334155">数据源</text>
    <text x="40" y="108" font-size="10.5" fill="#2563eb">●</text>
    <text x="52" y="108" font-size="10.5" fill="#334155">数据模型</text>
    <rect x="40" y="116" width="144" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="50" y="132" font-size="10" fill="#1d4ed8">sales_monthly</text>
    <text x="40" y="160" font-size="10.5" fill="#94a3b8">○</text>
    <text x="52" y="160" font-size="10.5" fill="#64748b">数据连接</text>
    <rect x="40" y="168" width="144" height="24" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="50" y="184" font-size="10" fill="#64748b">核心ERP</text>
    <text x="176" y="184" font-size="8" fill="#94a3b8">▾</text>

    <line x1="40" y1="206" x2="184" y2="206" stroke="#f1f5f9"/>
    <text x="40" y="226" font-size="9.5" fill="#94a3b8">表 / 视图</text>
    <text x="40" y="248" font-size="10" fill="#475569">dbo.v_store_sales</text>
    <text x="40" y="268" font-size="10" fill="#475569">dbo.store</text>
    <text x="40" y="288" font-size="10" fill="#475569">dbo.sales_order</text>

    <line x1="40" y1="310" x2="184" y2="310" stroke="#f1f5f9"/>
    <text x="40" y="330" font-size="9.5" fill="#94a3b8">列结构</text>
    <text x="40" y="350" font-size="9.5" fill="#64748b">月份 · 门店 · 销售额 · 日期</text>
    <text x="40" y="368" font-size="9" fill="#94a3b8">模型源走 DuckDB</text>

    <!-- SQL 编辑器 -->
    <text x="216" y="84" font-size="10" font-weight="600" fill="#334155">SQL 编辑器</text>
    <text x="286" y="84" font-size="9" fill="#94a3b8">Monaco</text>
    <rect x="216" y="94" width="272" height="222" rx="6" fill="#0f172a" opacity="0.03"/>
    <rect x="216" y="94" width="272" height="222" rx="6" fill="none" stroke="#e2e8f0"/>
    <text x="228" y="116" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#2563eb">SELECT</text>
    <text x="270" y="116" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#0f172a">月份, SUM(销售额) AS 销售额</text>
    <text x="228" y="134" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#2563eb">FROM</text>
    <text x="260" y="134" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#0f172a">sales_monthly</text>
    <text x="228" y="152" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#2563eb">GROUP BY</text>
    <text x="286" y="152" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#0f172a">月份</text>
    <text x="228" y="170" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#2563eb">ORDER BY</text>
    <text x="286" y="170" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#0f172a">月份</text>
    <text x="228" y="192" font-family="'SF Mono',Menlo,monospace" font-size="9" fill="#94a3b8">-- Ctrl/Cmd + Enter 运行</text>

    <rect x="402" y="330" width="86" height="28" rx="6" fill="#2563eb"/>
    <text x="445" y="349" font-size="10.5" fill="#ffffff" text-anchor="middle">运行</text>
    <text x="216" y="352" font-size="9" fill="#94a3b8">仅允许一条 SELECT / WITH</text>
    <text x="216" y="368" font-size="9" fill="#94a3b8">多语句或写操作直接拒绝</text>

    <!-- 结果 -->
    <text x="520" y="84" font-size="10" font-weight="600" fill="#334155">查询结果</text>
    <text x="620" y="84" font-size="9" fill="#94a3b8">共 12 行</text>
    <rect x="520" y="94" width="160" height="26" rx="5" fill="#f1f5f9"/>
    <text x="532" y="111" font-size="9" fill="#64748b">月份</text>
    <text x="614" y="111" font-size="9" fill="#64748b">销售额</text>
    <text x="532" y="140" font-size="9.5" fill="#0f172a">2026-10</text>
    <text x="614" y="140" font-size="9.5" fill="#334155">5,200,000</text>
    <line x1="520" y1="150" x2="680" y2="150" stroke="#f1f5f9"/>
    <text x="532" y="168" font-size="9.5" fill="#0f172a">2026-09</text>
    <text x="614" y="168" font-size="9.5" fill="#334155">4,800,000</text>
    <line x1="520" y1="178" x2="680" y2="178" stroke="#f1f5f9"/>
    <text x="532" y="196" font-size="9.5" fill="#0f172a">2026-08</text>
    <text x="614" y="196" font-size="9.5" fill="#334155">4,650,000</text>
    <line x1="520" y1="206" x2="680" y2="206" stroke="#f1f5f9"/>
    <text x="532" y="224" font-size="9.5" fill="#0f172a">2026-07</text>
    <text x="614" y="224" font-size="9.5" fill="#334155">4,420,000</text>
    <line x1="520" y1="234" x2="680" y2="234" stroke="#f1f5f9"/>
    <text x="532" y="252" font-size="9.5" fill="#0f172a">2026-06</text>
    <text x="614" y="252" font-size="9.5" fill="#334155">4,180,000</text>
    <line x1="520" y1="262" x2="680" y2="262" stroke="#f1f5f9"/>
    <text x="532" y="280" font-size="9.5" fill="#0f172a">2026-05</text>
    <text x="614" y="280" font-size="9.5" fill="#334155">3,960,000</text>

    <text x="520" y="316" font-size="9" fill="#94a3b8">超出上限自动截断并提示</text>
    <rect x="520" y="330" width="86" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="563" y="349" font-size="10" fill="#334155" text-anchor="middle">导出 CSV</text>
    <text x="616" y="349" font-size="9" fill="#94a3b8">耗时 240ms</text>

    <!-- 提示条 -->
    <rect x="24" y="404" width="672" height="34" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="40" y="426" font-size="10.5" fill="#92400e">⚠ 仅支持单条只读查询（SELECT / WITH）；连接源直连 SQL Server 并带超时保护。</text>

    <text x="24" y="458" font-size="9.5" fill="#94a3b8">模型源在 DuckDB 中执行；连接源按当前用户的连接权限校验后执行。</text>
  </g>
</svg>
