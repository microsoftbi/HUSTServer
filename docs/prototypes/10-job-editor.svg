<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" height="auto" role="img" aria-label="Job 编排画布线框图">
  <defs>
    <pattern id="dots10" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#dbe3ec"/>
    </pattern>
    <marker id="ar10" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#ffffff"/>
  <g font-family="-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif">
    <rect x="0" y="0" width="720" height="44" fill="#ffffff"/>
    <line x1="0" y1="44" x2="720" y2="44" stroke="#e2e8f0"/>
    <path d="M20 22H32M20 22l5-5M20 22l5 5" stroke="#64748b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <text x="42" y="27" font-size="12.5" font-weight="600" fill="#0f172a">Job · 月度出数</text>
    <rect x="424" y="8" width="56" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="452" y="26" font-size="11" fill="#334155" text-anchor="middle">保存</text>
    <rect x="488" y="8" width="64" height="28" rx="7" fill="#2563eb"/>
    <text x="520" y="26" font-size="11" fill="#ffffff" text-anchor="middle">运行</text>
    <rect x="560" y="8" width="80" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="600" y="26" font-size="10.5" fill="#334155" text-anchor="middle">调度设置</text>
    <rect x="648" y="8" width="56" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="676" y="26" font-size="10.5" fill="#334155" text-anchor="middle">导出</text>

    <!-- 步骤面板 -->
    <rect x="0" y="44" width="150" height="436" fill="#ffffff"/>
    <line x1="150" y1="44" x2="150" y2="480" stroke="#e2e8f0"/>
    <text x="16" y="68" font-size="9.5" fill="#94a3b8">步骤</text>
    <rect x="14" y="80" width="9" height="9" rx="2" fill="#bfdbfe"/>
    <text x="31" y="88" font-size="11" fill="#475569">工作流</text>
    <rect x="14" y="104" width="9" height="9" rx="2" fill="#bfdbfe"/>
    <text x="31" y="112" font-size="11" fill="#475569">SQL</text>
    <rect x="14" y="128" width="9" height="9" rx="2" fill="#ddd6fe"/>
    <text x="31" y="136" font-size="11" fill="#475569">加载成模型</text>

    <line x1="12" y1="160" x2="138" y2="160" stroke="#f1f5f9"/>
    <text x="16" y="184" font-size="9.5" fill="#94a3b8">从左侧拖入步骤</text>
    <text x="16" y="204" font-size="9.5" fill="#94a3b8">连线表示依赖</text>
    <text x="16" y="224" font-size="9.5" fill="#94a3b8">上游全部完成才执行</text>
    <text x="16" y="244" font-size="9.5" fill="#94a3b8">不同分支可并行</text>

    <line x1="12" y1="272" x2="138" y2="272" stroke="#f1f5f9"/>
    <text x="16" y="296" font-size="9.5" fill="#94a3b8">运行模式</text>
    <circle cx="20" cy="314" r="3.5" fill="#16a34a"/>
    <text x="30" y="318" font-size="9.5" fill="#64748b">运行</text>
    <circle cx="20" cy="334" r="3.5" fill="#94a3b8"/>
    <text x="30" y="338" font-size="9.5" fill="#64748b">跳过</text>
    <circle cx="20" cy="354" r="3.5" fill="#cbd5e1"/>
    <text x="30" y="358" font-size="9.5" fill="#64748b">禁用（含下游）</text>

    <!-- 画布 -->
    <rect x="150" y="44" width="390" height="436" fill="#fbfdff"/>
    <rect x="150" y="44" width="390" height="436" fill="url(#dots10)"/>

    <polyline points="310,119 326,119 326,170 336,170" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar10)"/>
    <polyline points="310,239 326,239 326,188 336,188" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar10)"/>
    <line x1="412" y1="202" x2="412" y2="296" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar10)"/>

    <rect x="180" y="96" width="130" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="245" y="115" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">取销售明细</text>
    <text x="245" y="132" font-size="9" fill="#94a3b8" text-anchor="middle">工作流 · 月度销售汇总</text>

    <rect x="180" y="216" width="130" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="245" y="235" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">清理临时表</text>
    <text x="245" y="252" font-size="9" fill="#94a3b8" text-anchor="middle">SQL · 核心ERP</text>

    <rect x="342" y="154" width="140" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="412" y="173" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">汇总月度销售</text>
    <text x="412" y="190" font-size="9" fill="#94a3b8" text-anchor="middle">工作流</text>

    <rect x="342" y="300" width="140" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="412" y="319" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">加载销售模型</text>
    <text x="412" y="336" font-size="9" fill="#7c3aed" text-anchor="middle">加载成模型 · sales_monthly</text>

    <text x="164" y="412" font-size="9" fill="#94a3b8">保存时校验：无环、无非法连线</text>
    <text x="164" y="428" font-size="9" fill="#94a3b8">导入 / 导出 .job.json 可跨环境迁移</text>

    <!-- 属性面板 -->
    <rect x="540" y="44" width="180" height="436" fill="#ffffff"/>
    <line x1="540" y1="44" x2="540" y2="480" stroke="#e2e8f0"/>
    <text x="556" y="70" font-size="12.5" font-weight="600" fill="#0f172a">步骤属性</text>
    <text x="556" y="88" font-size="9.5" fill="#94a3b8">工作流步骤</text>

    <text x="556" y="112" font-size="10" fill="#64748b">名称</text>
    <rect x="556" y="120" width="148" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="566" y="137" font-size="10.5" fill="#0f172a">汇总月度销售</text>

    <text x="556" y="168" font-size="10" fill="#64748b">工作流</text>
    <rect x="556" y="176" width="148" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="566" y="193" font-size="10.5" fill="#0f172a">月度销售汇总</text>
    <text x="686" y="193" font-size="9" fill="#94a3b8">▾</text>

    <text x="556" y="226" font-size="10" fill="#64748b">失败策略</text>
    <text x="556" y="246" font-size="10.5" fill="#2563eb">●</text>
    <text x="568" y="246" font-size="10.5" fill="#334155">中止下游</text>
    <text x="556" y="266" font-size="10.5" fill="#94a3b8">○</text>
    <text x="568" y="266" font-size="10.5" fill="#64748b">继续其他分支</text>

    <text x="556" y="296" font-size="10" fill="#64748b">运行模式</text>
    <text x="556" y="316" font-size="10.5" fill="#2563eb">●</text>
    <text x="568" y="316" font-size="10.5" fill="#334155">运行</text>
    <text x="556" y="336" font-size="10.5" fill="#94a3b8">○</text>
    <text x="568" y="336" font-size="10.5" fill="#64748b">跳过</text>
    <text x="556" y="356" font-size="10.5" fill="#94a3b8">○</text>
    <text x="568" y="356" font-size="10.5" fill="#64748b">禁用</text>

    <text x="556" y="388" font-size="9" fill="#94a3b8">禁用会连同其下游一并跳过；</text>
    <text x="556" y="402" font-size="9" fill="#94a3b8">跳过仍会执行下游依赖检查。</text>

    <line x1="556" y1="420" x2="704" y2="420" stroke="#f1f5f9"/>
    <text x="556" y="444" font-size="9.5" fill="#2563eb">查看工作流运行 →</text>
  </g>
</svg>
